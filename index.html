<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>:root{--y:#ffd21f;--yd:#d6a900;--n:#13265c;--nd:#0b1738;--g:#2ecc71;--gd:#1e9c52;--b:#2f80ed;--bd:#1f5bb5;--r:#e74c3c;--rd:#b0372b;--bg:#eaf3ff;--card:#fff;--tx:#10224f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-touch-callout:none;margin:0;min-height:100%;background:var(--n);color:var(--tx);font-family:'Cairo','Baloo Bhaijaan 2',Tahoma,sans-serif;direction:rtl;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{background:linear-gradient(#13265c,#1d3a86);min-height:100dvh}
#app{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);max-width:760px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
.btn{background:var(--y);color:var(--n);border:0;border-bottom:6px solid var(--yd);border-radius:18px;padding:10px 18px;font-size:1.05rem;font-weight:900;transition:transform .08s}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.btn.go{background:var(--g);border-bottom-color:var(--gd);color:#fff}
.btn.blue{background:var(--b);border-bottom-color:var(--bd);color:#fff}
.btn.red{background:var(--r);border-bottom-color:var(--rd);color:#fff}
.btn.sm{padding:6px 12px;font-size:.9rem;border-bottom-width:4px;border-radius:14px}
.btn.huge{display:block;width:100%;font-size:1.35rem;padding:14px 18px;margin:10px 0}
.btn:disabled{filter:grayscale(.8);opacity:.6}
.btn-ico{background:#fff;border:3px solid var(--n);border-radius:14px;width:44px;height:44px;font-size:1.2rem;font-weight:900;color:var(--n);flex:none}
.coins{background:#fff;border:3px solid var(--y);border-radius:20px;padding:3px 12px;font-weight:900;white-space:nowrap}
.sm{font-size:.9rem;opacity:.85}.center{text-align:center}
.topbar,.runtop{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--n);color:#fff}

.runtop{background:var(--n)}
.cuptitle{flex:1;text-align:center;font-weight:900}
.badge{background:var(--r);color:#fff;border-radius:12px;padding:0 8px;font-size:.85rem}
/* home */
.home{padding:12px 16px 24px;background:radial-gradient(circle at 50% 30%,#fff 0,#cfe4ff 60%,#9fc4ff 100%);min-height:100dvh}
.hbar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.chip{background:#fff;border:3px solid var(--n);border-radius:20px;padding:2px 12px;font-weight:900;font-size:.95rem}

.logo .l1{font-size:2rem;font-weight:900;color:var(--n)}

.herobox{position:relative;text-align:center;margin:4px 0}

.foot{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}

.map{padding:12px}

.node .nt{flex:1;display:flex;flex-direction:column;font-weight:700}.node .nt small{font-weight:600;opacity:.8}

.node.locked{filter:grayscale(.9);opacity:.7}
.st{color:#cbd5e1;font-size:1.1rem}.st.on{color:#ffb800;text-shadow:0 1px 0 #b87d00}
.starsbig{font-size:2.2rem;text-align:center;letter-spacing:4px}
.lesson{padding:18px;text-align:center}
.lbig{font-size:5rem;line-height:1.2}.lbig svg{height:150px;width:auto}
.lesson h2{margin:4px 0;color:var(--uc,var(--n))}
.intro{font-size:1.1rem;font-weight:700}
/* run */
.run{background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
.h{color:#ff3b5c}.hearts .h{font-size:1.3rem}.h.lost{color:#7b8aa8;filter:grayscale(1);opacity:.5}
.hearts{display:flex;white-space:nowrap}
.bar{flex:1;height:16px;background:rgba(255,255,255,.25);border-radius:10px;position:relative}
.bar i{display:block;height:100%;background:var(--y);border-radius:10px;width:0;transition:width .1s}
.bar span{position:absolute;left:-4px;top:-8px;font-size:1.3rem}
.cwrap{position:relative;background:#000;display:flex;justify-content:center}

.tip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;border-radius:14px;padding:4px 14px;font-weight:700;transition:opacity 1s;pointer-events:none;white-space:nowrap}
.runbtns{flex:1;padding:12px 16px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.btn.jump{width:100%;max-width:520px;height:100%;min-height:90px;max-height:240px;font-size:1.8rem;padding:16px;background:var(--b);border-bottom-color:var(--bd);color:#fff;touch-action:none}
/* modal */
.qmodal{position:fixed;inset:0;background:rgba(10,20,50,.72);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50;opacity:0;transition:opacity .2s;overflow:auto}
.qmodal.on{opacity:1}
.qcard{background:#fff;border-radius:24px;border:4px solid var(--n);padding:14px;width:100%;max-width:560px;max-height:94dvh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.qmodal.small .qcard{text-align:center}.qmodal.small .big{font-size:1.2rem;font-weight:900;margin:8px 0 14px}
.qmodal.cards{z-index:60}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qav{width:50px;flex:none}.qav svg{width:50px;height:auto}
.qmeta{flex:1;font-weight:900;font-size:.95rem}.hh .h{font-size:.95rem}
.qtop{display:flex;align-items:center;justify-content:space-between}
.qtype{background:var(--y);color:var(--n);font-weight:900;border-radius:12px;padding:1px 10px;font-size:.85rem}
.spk{border:0;background:#e3efff;border-radius:50%;width:38px;height:38px;font-size:1.1rem}
.qtext{font-size:1.2rem;font-weight:900;margin:10px 2px;line-height:1.7}
.blank{display:inline-block;min-width:70px;border-bottom:4px dashed var(--b);text-align:center;color:var(--b)}.blank.filled{color:var(--gd);border-color:var(--g)}
.opts{display:grid;gap:8px}
.opt{background:#f4f8ff;border:3px solid #bcd3ff;border-bottom-width:6px;border-radius:16px;padding:10px 12px;font-size:1.05rem;font-weight:800;text-align:right;color:var(--tx);transition:.1s}
.opt:active{transform:translateY(3px)}
.opt.right{background:#d8ffe6;border-color:var(--g)}.opt.wrong{background:#ffe0dc;border-color:var(--r);animation:shake .4s}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.tfo{grid-template-columns:1fr 1fr}.opt.tf{text-align:center;font-size:1.4rem;padding:16px}
.why{border-radius:14px;padding:8px 12px;margin-top:10px;line-height:1.7;font-weight:700}
.why.good{background:#e0ffec;border:2px solid var(--g)}.why.bad{background:#fff0d6;border:2px solid #f2a33a}
.hint{margin-top:8px;font-weight:800;color:var(--rd);text-align:center}
.qfb .btn{display:block;margin:10px auto 2px;min-width:160px}
.slots{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.slot{background:#eef4ff;border:3px dashed #9db8ee;border-radius:12px;padding:8px 10px;min-height:44px;font-weight:800}.slot.full{border-style:solid;border-color:var(--g);background:#e0ffec}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip,.pool .chip{background:var(--y);border:0;border-bottom:4px solid var(--yd);border-radius:14px;padding:8px 12px;font-weight:800;font-size:1rem;color:var(--n)}.chip.used{opacity:.3}
.mat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:flex;flex-direction:column;gap:8px}
.mi{background:#f4f8ff;border:3px solid #bcd3ff;border-radius:14px;padding:8px;font-weight:800;font-size:.95rem;color:var(--tx);min-height:52px}
.mi.sel{background:#fff6c4;border-color:var(--y);transform:scale(1.03)}
.mi.ok{color:#fff}.mi.c0{background:#2f80ed}.mi.c1{background:#27ae60}.mi.c2{background:#9b51e0}.mi.c3{background:#f2994a}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* cards */
.cardview{text-align:center}.cv-ico{font-size:4rem}.cardview h3{margin:4px 0;color:var(--b);font-size:1.4rem}.cardview p{font-size:1.15rem;line-height:1.9;font-weight:700;margin:6px 4px 10px;text-align:right;min-height:140px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:#cbd5e1}.dots i.on{background:var(--b);transform:scale(1.3)}
.end{text-align:center}.end h2{margin:6px 0}.endav svg{height:170px;width:auto}.score{font-size:2.6rem;font-weight:900;direction:ltr}.how{text-align:right;line-height:1.9;font-weight:700}
/* cup */
.sb{display:flex;align-items:center;background:var(--nd);color:#fff;padding:6px 10px}
.sb .tm{flex:1;display:flex;flex-direction:column;align-items:center}.sb .tm b{font-size:2.2rem;line-height:1;color:var(--y)}.sb .tm small{font-size:.85rem;font-weight:800}
.sb .mid{text-align:center;flex:1.2}.sb .stage{font-weight:900;color:var(--y)}
.pitch{position:relative;direction:ltr;height:230px;background:repeating-linear-gradient(90deg,#2f9e44 0 12.5%,#37b24d 12.5% 25%);overflow:hidden;border-bottom:4px solid #fff}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid rgba(255,255,255,.5)}
.pitch.flash{animation:flash .5s 2}@keyframes flash{50%{filter:brightness(1.5)}}
.goal{position:absolute;right:0;bottom:14%;width:22%;height:68%;border:5px solid #fff;border-right:0;background:rgba(255,255,255,.12)}
.net{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.35) 8px 9px),repeating-linear-gradient(-45deg,transparent 0 8px,rgba(255,255,255,.35) 8px 9px)}
.keeper{position:absolute;right:20%;bottom:0;height:88%;transition:transform .5s}.keeper img{height:100%;display:block}
.keeper.dive{transform:translate(-20px,26px) rotate(-35deg)}
.yun{position:absolute;left:4%;bottom:4%;height:80%;transition:none}
.ball{position:absolute;width:30px;left:26%;bottom:8%;z-index:3}
.shout{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.6);font-weight:900;font-size:1.5rem;padding:4px 16px;border-radius:20px;opacity:0;transition:.25s;white-space:nowrap;z-index:5;direction:rtl}
.shout.on{opacity:1;transform:translateX(-50%) scale(1)}.shout.g{background:var(--y);color:var(--n)}.shout.b{background:#fff;color:var(--rd)}
.cupq{padding:10px 12px 24px}
.cup{min-height:100dvh;background:var(--bg)}
.tbar{height:10px;background:#cbd5e1}.tbar i{display:block;height:100%;background:var(--r);width:100%;transition:width .1s linear}
.cups{padding:12px;display:flex;flex-direction:column;gap:12px}
.cupcard{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--y);border-radius:20px;padding:10px}
.cupcard.locked{filter:grayscale(1);opacity:.7}.ctr svg{width:64px;height:auto}.cinfo{flex:1}.cinfo h3{margin:0 0 4px}
.mchips{display:flex;gap:4px;flex-wrap:wrap}.mc{background:#e3efff;border-radius:10px;padding:1px 8px;font-size:.8rem;font-weight:800}.mc.won{background:#c8f7d8}.mc.cur{background:var(--y)}
/* arcade etc */
.arc{padding:16px;display:flex;flex-direction:column;gap:14px}.arcb{display:flex;align-items:center;gap:12px;text-align:right;padding:14px}.arcb span{font-size:2.4rem}.arcb small{display:block;font-weight:600;opacity:.9}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.mcard{position:relative;height:96px;border:0;background:none;padding:0;perspective:600px}
.mcard span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;font-weight:900;padding:4px;font-size:.88rem;line-height:1.35;backface-visibility:hidden;transition:transform .35s}
.mcard .front{background:var(--b);color:#fff;font-size:2rem;border-bottom:5px solid var(--bd)}
.mcard .back{transform:rotateY(180deg);background:#fff;border:3px solid var(--y);color:var(--n)}.mcard .back.t{background:#fff6c4}
.mcard.up .front,.mcard.done .front{transform:rotateY(180deg)}.mcard.up .back,.mcard.done .back{transform:rotateY(0)}
.mcard.done .back{background:#d8ffe6;border-color:var(--g)}
.shelf{display:flex;justify-content:space-around;padding:14px;background:linear-gradient(#8a5a2b,#6b4220);border-bottom:8px solid #4a2f10}
.tr{text-align:center;filter:grayscale(1) brightness(.6);opacity:.7;color:#fff}.tr.on{filter:none;opacity:1}.tr svg{width:70px;height:auto}.tr small{display:block;font-weight:800}
.sec{margin:12px 16px 0}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.sticker{background:#fff;border:3px solid #cbd5e1;border-radius:16px;padding:8px;text-align:center;opacity:.6}.sticker.on{border-color:var(--y);background:#fffbe6;opacity:1}.sticker span{font-size:2.2rem;display:block}.sticker small{display:block;font-size:.78rem;font-weight:600}
.parent{padding:14px;line-height:1.8}.parent table{width:100%;border-collapse:collapse;font-size:.9rem}.parent td{border-bottom:1px solid #d6e2f5;padding:3px 4px}
.parent textarea{width:100%;height:70px;border:2px solid #bcd3ff;border-radius:10px;padding:6px;font-size:.75rem;direction:ltr;-webkit-user-select:text;user-select:text;margin:4px 0}
.tg{display:block;font-weight:700;margin:6px 0}.tg input{width:20px;height:20px;vertical-align:middle;margin-left:8px}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:var(--n);color:#fff;border:3px solid var(--y);border-radius:20px;padding:8px 18px;font-weight:900;z-index:100;transition:transform .35s;max-width:92vw;text-align:center}.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (max-height:460px) and (orientation:landscape){#cv{width:min(100%,calc((100dvh - 120px)*2))}.runbtns{padding:6px;flex:none}.btn.jump{padding:8px;font-size:1.1rem;height:auto;min-height:0}.logo .l2{font-size:2.8rem}}

<script>/* ===== Captain Yunus — cartoon art (all SVG, drawn in code) ===== */
const C = {
  skin:'#e8b68d', skinD:'#cf986f', out:'#2a170d', hair:'#2b170d', hairL:'#4d2d19',
  jer:'#ffd21f', jerD:'#e5b400', navy:'#13265c', white:'#ffffff', red:'#e63946'
};
function _rot(a,x,y){ const r=a*Math.PI/180, c=Math.cos(r), s=Math.sin(r); return [x*c-y*s, x*s+y*c]; }
const svgURI = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);

/* poses: a = arm angle (outward, deg), l = leg angle (outward, deg) for [left,right] on screen */
const POSES = {
  stand:  {aL:10, aR:10, lL:4,  lR:4,  mood:'happy', tilt:0},
  idle:   {aL:14, aR:14, lL:5,  lR:5,  mood:'happy', tilt:-2},
  run1:   {aL:62, aR:8,  lL:34, lR:-6, mood:'happy', tilt:-3},
  run2:   {aL:8,  aR:62, lL:-6, lR:34, mood:'happy', tilt:3},
  jump:   {aL:135,aR:135,lL:28, lR:-14,mood:'cheer', tilt:0},
  cheer:  {aL:118,aR:118,lL:10, lR:10, mood:'cheer', tilt:0, thumbs:true},
  think:  {aL:14, aR:150,lL:4,  lR:4,  mood:'think', tilt:4, chin:true},
  kick:   {aL:50, aR:70, lL:-6, lR:52, mood:'cheer', tilt:-4},
  hurt:   {aL:40, aR:30, lL:14, lR:-14,mood:'oops',  tilt:8},
  sad:    {aL:6,  aR:6,  lL:2,  lR:2,  mood:'sad',   tilt:6},
  wow:    {aL:70, aR:70, lL:8,  lR:8,  mood:'wow',   tilt:0},
  wave:   {aL:10, aR:140,lL:4,  lR:4,  mood:'happy', tilt:0}
};

function _eyes(m){
  const brow = (a)=>`<path d="${a}" stroke="${C.hair}" stroke-width="6.5" fill="none" stroke-linecap="round"/>`;
  const eye = (cx,dx=0,dy=0,ry=15)=>`<ellipse cx="${cx}" cy="0" rx="12.5" ry="${ry}" fill="#fff" stroke="${C.out}" stroke-width="2.4"/>
    <circle cx="${cx+dx}" cy="${dy+1}" r="8.6" fill="#5a3418"/><circle cx="${cx+dx}" cy="${dy+1}" r="5.6" fill="#1a0d07"/>
    <circle cx="${cx+dx+3}" cy="${dy-3}" r="2.8" fill="#fff"/><circle cx="${cx+dx-3}" cy="${dy+4}" r="1.3" fill="#fff"/>`;
  if(m==='cheer') return `<g transform="translate(0,-4)">${eye(-27,0,1,14)}${eye(27,0,1,14)}</g>`+
      brow('M-42 -24 Q-27 -34 -12 -24')+brow('M12 -24 Q27 -34 42 -24');
  if(m==='sad') return `<g transform="translate(0,-2)">${eye(-27,0,5,14)}${eye(27,0,5,14)}</g>`+
      brow('M-42 -20 L-14 -30')+brow('M42 -20 L14 -30')+`<path d="M-33 14 q-6 10 0 16 q6 -6 0 -16z" fill="#7fd0ff" stroke="${C.out}" stroke-width="1.6"/>`;
  if(m==='think') return `<g transform="translate(0,-4)">${eye(-27,5,-4,14)}${eye(27,5,-4,14)}</g>`+
      brow('M-42 -22 Q-27 -28 -12 -22')+brow('M12 -34 Q27 -42 42 -30');
  if(m==='wow') return `<g transform="translate(0,-4)">${eye(-27,0,0,17)}${eye(27,0,0,17)}</g>`+
      brow('M-42 -30 Q-27 -42 -12 -30')+brow('M12 -30 Q27 -42 42 -30');
  if(m==='oops') return `<path d="M-38 -6 l22 12 M-16 -6 l-22 12 M16 -6 l22 12 M38 -6 l-22 12" stroke="${C.out}" stroke-width="5" stroke-linecap="round"/>`+
      brow('M-42 -22 L-14 -30')+brow('M42 -22 L14 -30');
  return `<g transform="translate(0,-3)">${eye(-27,0,1,15)}${eye(27,0,1,15)}</g>`+
      brow('M-42 -26 Q-27 -34 -12 -27')+brow('M12 -27 Q27 -34 42 -26');

const _CACHE={};
function art(kind,a,b,c,d,e){
  const key=[kind,a,b,c,d,e].join('|');
  if(_CACHE[key]) return _CACHE[key];
  let s;
  if(kind==='yunus') s=yunusSVG(a,b);
  else if(kind==='keeper') s=keeperSVG(a,b,c,d,e);
  else if(kind==='ball') s=ballSVG(a||20);
  else if(kind==='trophy') s=trophySVG(a);
  return (_CACHE[key]=s);
}

  try { const r = localStorage.getItem(KEY); S = r ? Object.assign(defState(), JSON.parse(r)) : defState(); } catch (e) { S = defState(); }
  S.set = Object.assign(defState().set, S.set || {});
}

const totalStars = () => Object.values(S.stars).reduce((a, b) => a + b, 0);

const unitDone = u => UBY[u].lessons.every(l => S.done[l.id]);

}

  const all = shuf(LESSONS.flatMap(l => l.vocab.map(v => ({ t: v[0], d: v[1] })))).slice(0, 6);
  const cards = shuf(all.flatMap((p, i) => [{ i, txt: p.t, k: 't' }, { i, txt: p.d, k: 'd' }]));
  let open = [], found = 0, moves = 0, lock = false;
  host.innerHTML = `<div class="runtop"><button class="btn-ico" id="mx">✖</button><div class="cuptitle">🧠 لعبة الذاكرة</div><div class="coins">حركات <b id="mv">٠</b></div></div><p class="sm center">لاقي المصطلح وتعريفه 👇</p><div class="mem" id="mg"></div>`;

      }

  });

      <div class="starsbig">${starsHTML(S.stars[id] || 0)}</div>
      <button class="btn blue huge" id="l1">📖 درس سريع (${D(l.cards.length)} كروت)</button>
      <button class="btn go huge" id="l2">🏃 ابدأ الجري</button>
      <p class="sm">هتقابل ${D(7)} عقبات. كل عقبة بتتفتح بإجابة صح. عندك ${D(5)} قلوب ❤ — وخد بالك من العقبات الصغيرة اللي بتتنطط!</p></div>`;
    wireBack('map');
    $('#l1').onclick = () => { sfx('click'); showCards(l); };
    $('#l2').onclick = () => { sfx('click'); go('run', id); };
  },

  run(id) {
    const l = LBY[id]; APP.innerHTML = '<div class="run" id="rh"></div>';
    const r = startRun(l, $('#rh'), act => {
      if (act === 'retry') go('run', id);
      else if (act === 'next') go('lesson', nextTarget(l).id);
      else if (act === 'cards') { go('lesson', id); setTimeout(() => showCards(l), 200); }
      else go('map');
    });
    CLEAN = r.stop;
  },

  cups() {
    APP.innerHTML = bar('الكؤوس') + '<div class="cups" id="cl"></div>'; wireBack('home');
    const list = $('#cl');
    [...UNITS.map(u => u.id), 'grand'].forEach(id => {
      const c = cupDef(id), un = cupUnlocked(id), w = S.cups[id] || 0, tot = c.sizes.length;
      const box = el('div', 'cupcard' + (un ? '' : ' locked'));
      box.innerHTML = `<div class="ctr">${w >= tot ? art('trophy', true) : art('trophy', false)}</div><div class="cinfo"><h3>${D(esc(c.name))}</h3>
        <div class="mchips">${c.opps.map((o, i) => `<span class="mc ${i < w ? 'won' : i === w ? 'cur' : ''}">${i < w ? '✓' : D(i + 1)} ${esc(o.stage)}</span>`).join('')}</div>
        <small>${w >= tot ? 'كسبتها! 🎉' : un ? 'الماتش الجاي: ' + esc(c.opps[w].n) : '🔒 ' + (id === 'grand' ? 'اكسب كؤوس الوحدات التلاتة' : 'خلّص دروس الوحدة')}</small></div>
        <button class="btn ${un ? 'go' : ''}" ${un ? '' : 'disabled'}>${w >= tot ? 'العب تاني' : 'العب'}</button>`;
      $('button', box).onclick = () => { if (!un) return; sfx('click'); if (w >= tot) { S.cups[id] = tot - 1; } go('cupmenu', id); };
      list.appendChild(box);
    });
  },

  cupmenu(id) {
    const c = cupDef(id), w = Math.min(S.cups[id] || 0, c.sizes.length - 1), o = c.opps[w];
    APP.innerHTML = bar(D(esc(c.name))) + `<div class="lesson"><div class="lbig">${art('keeper', o.s, o.sh)}</div><h2>${esc(o.stage)}</h2><p class="intro">ضد <b>${esc(o.n)}</b></p>
      <p class="sm">${D(c.sizes[w])} تسديدات. كل إجابة صح = هدف ليونس ⚽ — وكل إجابة غلط = الحارس بيصد والخصم بيسجل. اللي معاه أهداف أكتر بيكسب!</p>
      <button class="btn go huge" id="m1">⚽ ابدأ الماتش</button></div>`;
    wireBack(id === 'grand' ? 'cups' : 'map');
    $('#m1').onclick = () => { sfx('click'); go('match', id); };
  },

  match(id) {
    APP.innerHTML = '<div class="run" id="rh"></div>';
    const r = startMatch(id, $('#rh'), act => {
      if (act === 'retry' || act === 'next') go('match', id); else if (act === 'trophies') go('trophies'); else go('cups');
    });
    CLEAN = r.stop;
  },

  arcade() {
    APP.innerHTML = bar('ألعاب') + `<div class="arc">
      <button class="btn blue arcb" id="a1"><span>🧠</span><div><b>لعبة الذاكرة</b><small>وصّل المصطلح بتعريفه</small></div></button>
      <button class="btn blue arcb" id="a2"><span>⚡</span><div><b>تحدي السرعة</b><small>١٠ أسئلة — ١٤ ثانية للسؤال</small></div></button>
      <button class="btn blue arcb" id="a3"><span>📓</span><div><b>كراسة الأخطاء</b><small>صحّح الأسئلة اللي غلطت فيها (${D(S.mist.length)})</small></div></button></div>`;
    wireBack('home');
    $('#a1').onclick = () => { sfx('click'); go('mem'); }; $('#a2').onclick = () => { sfx('click'); go('speed'); }; $('#a3').onclick = () => { sfx('click'); go('mist'); };
  },
  mem() { APP.innerHTML = '<div class="run" id="rh"></div>'; startMemory($('#rh'), () => go('arcade')); },
  speed() { APP.innerHTML = '<div class="run" id="rh"></div>'; startSpeed($('#rh'), () => go('arcade')); },
  mist() {
    if (!S.mist.length) { APP.innerHTML = bar('كراسة الأخطاء') + `<div class="lesson"><div class="lbig">${art('yunus', 'cheer')}</div><h2>الكراسة فاضية! 🎉</h2><p class="intro">مفيش أخطاء للمراجعة. كمّل العب وأي سؤال تغلط فيه هيتسجل هنا.</p></div>`; wireBack('home'); return; }
    APP.innerHTML = '<div class="run" id="rh"></div>'; startMistakes($('#rh'), () => go('home'));
  },

  trophies() {
    APP.innerHTML = bar('الجوائز') + '<div class="shelf" id="sf"></div><h3 class="sec">الميداليات</h3><div class="stk" id="sk"></div>'; wireBack('home');
    const sf = $('#sf');
    [['u1', 'كأس ١'], ['u2', 'كأس ٢'], ['u3', 'كأس ٣'], ['grand', 'الذهبي']].forEach(([id, n]) => {
      const w = id === 'grand' ? (S.cups.grand || 0) >= 4 : (S.cups[id] || 0) >= 3;
      sf.innerHTML += `<div class="tr ${w ? 'on' : ''}">${art('trophy', id === 'grand')}<small>${n}</small></div>`;
    });
    $('#sk').innerHTML = STK.map(k => `<div class="sticker ${S.stk[k[0]] ? 'on' : ''}"><span>${S.stk[k[0]] ? k[1] : '🔒'}</span><b>${k[2]}</b><small>${k[3]}</small></div>`).join('');
    const rk = el('p', 'sm center', `رتبتك: <b>${rankOf()}</b> — ⭐ ${D(totalStars())}`); APP.appendChild(rk);
  },

  parent() {
    const code = btoa(JSON.stringify(S));
    APP.innerHTML = bar('ركن الأهل') + `<div class="parent">
      <h3>التقدم</h3><table>${LESSONS.map(l => `<tr><td>${D(esc(l.title))}</td><td>${S.done[l.id] ? '✅' : '—'}</td><td>${starsHTML(S.stars[l.id] || 0)}</td></tr>`).join('')}</table>
      <p>الكؤوس: ${[...UNITS.map(u => u.id), 'grand'].map(id => `${cupDef(id).name}: ${D(S.cups[id] || 0)}/${D(cupDef(id).sizes.length)}`).join(' • ')}</p>
      <p>أسئلة في كراسة الأخطاء: <b>${D(S.mist.length)}</b></p>
      <h3>الإعدادات</h3>
      <label class="tg"><input type="checkbox" id="p1" ${S.set.sound ? 'checked' : ''}> المؤثرات الصوتية</label>
      <label class="tg"><input type="checkbox" id="p2" ${S.set.music ? 'checked' : ''}> الموسيقى</label>
      <label class="tg"><input type="checkbox" id="p3" ${S.set.unlock ? 'checked' : ''}> فتح كل الكؤوس (بدون شرط إنهاء الدروس)</label>
      <h3>حفظ التقدم / نقله لجهاز تاني</h3>
      <p class="sm">انسخ الكود ده واحتفظ بيه. على جهاز تاني الصقه في الخانة واضغط «استرجاع».</p>
      <textarea id="pc" readonly>${code}</textarea><button class="btn sm" id="p4">📋 نسخ الكود</button>
      <textarea id="pi" placeholder="الصق الكود هنا"></textarea><button class="btn sm" id="p5">استرجاع</button>
      <h3>مسح كل التقدم</h3><button class="btn red sm" id="p6">🗑️ ابدأ من الصفر</button></div>`;
    wireBack('home');
    $('#p1').onchange = e => { S.set.sound = e.target.checked; save(); };
    $('#p2').onchange = e => { S.set.music = e.target.checked; save(); music(); };
    $('#p3').onchange = e => { S.set.unlock = e.target.checked; save(); };
    $('#p4').onclick = () => { const t = $('#pc'); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } toast('تم النسخ ✅'); };
    $('#p5').onclick = () => { try { const o = JSON.parse(atob($('#pi').value.trim())); S = Object.assign(defState(), o); save(); toast('تم الاسترجاع ✅'); go('parent'); } catch (e) { toast('الكود غير صحيح ❌'); } };
    $('#p6').onclick = async () => { if (await ask('متأكد إنك عايز تمسح كل التقدم؟', 'امسح', 'لأ')) { S = defState(); save(); go('home'); } };
  }
};

function help() {
  const m = modal(`<div class="end"><div class="endav">${art('yunus', 'wave')}</div><h2>إزاي ألعب؟</h2>
    <ol class="how"><li>اختار درس من الخريطة، واقرأ الدرس السريع.</li><li>ابدأ الجري! اضغط على الشاشة أو الزرار عشان تقفز فوق العقبات الصغيرة وتجمع العملات 🪙</li><li>لما توصل لعقبة كبيرة، جاوب على السؤال وهتتكسر بكورة ⚽</li><li>كل غلطة بتخسّرك قلب ❤ (عندك ٥).</li><li>خلّص دروس الوحدة وابدأ الكأس: كل إجابة صح = هدف! اكسب الماتشات لحد النهائي 🏆</li><li>📲 لتثبيتها على التليفون: من قائمة كروم ⋮ اختار «تثبيت التطبيق».</li></ol>
    <button class="btn go" id="hx">يلا بينا!</button></div>`); $('#hx', m).onclick = () => m.close();
}

function init() {
  load(); APP = $('#app'); music();
  document.addEventListener('pointerdown', () => ac(), { once: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { try { speechSynthesis.cancel(); } catch (e) { } } });
  document.addEventListener('contextmenu', e => e.preventDefault());
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => { });
  go('home');
}
document.addEventListener('DOMContentLoaded', init);

</script></body></html>
