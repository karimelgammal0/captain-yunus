<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#13265c"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="كابتن يونس"><title>كابتن يونس</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>:root{--y:#ffd21f;--yd:#d6a900;--n:#13265c;--nd:#0b1738;--g:#2ecc71;--gd:#1e9c52;--b:#2f80ed;--bd:#1f5bb5;--r:#e74c3c;--rd:#b0372b;--bg:#eaf3ff;--card:#fff;--tx:#10224f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-touch-callout:none;margin:0;min-height:100%;background:var(--n);color:var(--tx);font-family:'Cairo','Baloo Bhaijaan 2',Tahoma,sans-serif;direction:rtl;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{background:linear-gradient(#13265c,#1d3a86);min-height:100dvh}
#app{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);max-width:760px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
.btn{background:var(--y);color:var(--n);border:0;border-bottom:6px solid var(--yd);border-radius:18px;padding:10px 18px;font-size:1.05rem;font-weight:900;transition:transform .08s}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.btn.go{background:var(--g);border-bottom-color:var(--gd);color:#fff}
.btn.blue{background:var(--b);border-bottom-color:var(--bd);color:#fff}
.btn.red{background:var(--r);border-bottom-color:var(--rd);color:#fff}
.btn.sm{padding:6px 12px;font-size:.9rem;border-bottom-width:4px;border-radius:14px}
.btn.huge{display:block;width:100%;font-size:1.35rem;padding:14px 18px;margin:10px 0}
.btn:disabled{filter:grayscale(.8);opacity:.6}
.btn-ico{background:#fff;border:3px solid var(--n);border-radius:14px;width:44px;height:44px;font-size:1.2rem;font-weight:900;color:var(--n);flex:none}
.coins{background:#fff;border:3px solid var(--y);border-radius:20px;padding:3px 12px;font-weight:900;white-space:nowrap}
.sm{font-size:.9rem;opacity:.85}.center{text-align:center}
.topbar,.runtop{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--n);color:#fff}
.topbar h1{flex:1;margin:0;font-size:1.25rem;text-align:center}
.runtop{background:var(--n)}
.cuptitle{flex:1;text-align:center;font-weight:900}
.badge{background:var(--r);color:#fff;border-radius:12px;padding:0 8px;font-size:.85rem}
/* home */
.home{padding:12px 16px 24px;background:radial-gradient(circle at 50% 30%,#fff 0,#cfe4ff 60%,#9fc4ff 100%);min-height:100dvh}
.hbar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.chip{background:#fff;border:3px solid var(--n);border-radius:20px;padding:2px 12px;font-weight:900;font-size:.95rem}
.chip.rank{background:var(--y)}
.logo{text-align:center;margin-top:8px;line-height:1}
.logo .l1{font-size:2rem;font-weight:900;color:var(--n)}
.logo .l2{font-size:min(4.2rem,9dvh);font-weight:900;color:var(--n);-webkit-text-stroke:0;text-shadow:0 5px 0 var(--y),0 8px 0 rgba(0,0,0,.2)}
.logo .l3{font-size:.8rem;font-weight:700;margin-top:6px;opacity:.8}
.herobox{position:relative;text-align:center;margin:4px 0}
.hero-art svg{width:100%;height:auto;max-height:290px;display:block;margin:auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
.hero-art.big{max-width:min(220px,27dvh);margin:0 auto}
.bubble{position:absolute;right:6%;top:4%;background:#fff;border:3px solid var(--n);border-radius:20px;padding:6px 12px;font-weight:900;max-width:46%;font-size:.95rem;cursor:pointer;animation:bob 2.4s ease-in-out infinite}
.bubble::after{content:"";position:absolute;bottom:-12px;left:20px;border:8px solid transparent;border-top-color:var(--n)}
@keyframes bob{50%{transform:translateY(-6px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.grid2 .btn{font-size:1.1rem;line-height:1.4}
.foot{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
/* map */
.map{padding:12px}
.unit{background:#fff;border:3px solid var(--uc);border-radius:22px;margin-bottom:16px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.uh{display:flex;gap:10px;align-items:center;background:var(--uc);color:#fff;padding:10px 14px}
.uh h2{margin:0;font-size:1.05rem;line-height:1.3}.uh small{opacity:.9}.ui{font-size:2rem}
.path{padding:10px;display:flex;flex-direction:column;gap:8px}
.node{display:flex;align-items:center;gap:10px;text-align:right;background:#f4f8ff;border:3px solid #cfe0ff;border-radius:16px;padding:8px 10px;width:100%}
.node.done{background:#eafff1;border-color:#9ae6b4}
.node .ni{font-size:1.8rem;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;border:3px solid var(--uc);flex:none}
.node .nt{flex:1;display:flex;flex-direction:column;font-weight:700}.node .nt small{font-weight:600;opacity:.8}
.node .go{color:var(--uc);font-weight:900}
.cupnode{background:#fff7d6;border-color:var(--y)}
.grandnode{background:linear-gradient(135deg,#fff3b0,#ffd21f);border-color:var(--yd);margin:0 12px 16px;width:auto}
.node.locked{filter:grayscale(.9);opacity:.7}
.st{color:#cbd5e1;font-size:1.1rem}.st.on{color:#ffb800;text-shadow:0 1px 0 #b87d00}
.starsbig{font-size:2.2rem;text-align:center;letter-spacing:4px}
.lesson{padding:18px;text-align:center}
.lbig{font-size:5rem;line-height:1.2}.lbig svg{height:150px;width:auto}
.lesson h2{margin:4px 0;color:var(--uc,var(--n))}
.intro{font-size:1.1rem;font-weight:700}
/* run */
.run{background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
.h{color:#ff3b5c}.hearts .h{font-size:1.3rem}.h.lost{color:#7b8aa8;filter:grayscale(1);opacity:.5}
.hearts{display:flex;white-space:nowrap}
.bar{flex:1;height:16px;background:rgba(255,255,255,.25);border-radius:10px;position:relative}
.bar i{display:block;height:100%;background:var(--y);border-radius:10px;width:0;transition:width .1s}
.bar span{position:absolute;left:-4px;top:-8px;font-size:1.3rem}
.cwrap{position:relative;background:#000;display:flex;justify-content:center}
#cv{width:min(100%,calc((100dvh - 190px)*var(--ar,2)));max-width:100%;display:block;touch-action:none;background:#87ceeb}
.tip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;border-radius:14px;padding:4px 14px;font-weight:700;transition:opacity 1s;pointer-events:none;white-space:nowrap}
.runbtns{flex:1;padding:12px 16px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.btn.jump{width:100%;max-width:520px;height:100%;min-height:90px;max-height:240px;font-size:1.8rem;padding:16px;background:var(--b);border-bottom-color:var(--bd);color:#fff;touch-action:none}
/* modal */
.qmodal{position:fixed;inset:0;background:rgba(10,20,50,.72);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50;opacity:0;transition:opacity .2s;overflow:auto}
.qmodal.on{opacity:1}
.qcard{background:#fff;border-radius:24px;border:4px solid var(--n);padding:14px;width:100%;max-width:560px;max-height:94dvh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.qmodal.small .qcard{text-align:center}.qmodal.small .big{font-size:1.2rem;font-weight:900;margin:8px 0 14px}
.qmodal.cards{z-index:60}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qav{width:50px;flex:none}.qav svg{width:50px;height:auto}
.qmeta{flex:1;font-weight:900;font-size:.95rem}.hh .h{font-size:.95rem}
.qtop{display:flex;align-items:center;justify-content:space-between}
.qtype{background:var(--y);color:var(--n);font-weight:900;border-radius:12px;padding:1px 10px;font-size:.85rem}
.spk{border:0;background:#e3efff;border-radius:50%;width:38px;height:38px;font-size:1.1rem}
.qtext{font-size:1.2rem;font-weight:900;margin:10px 2px;line-height:1.7}
.blank{display:inline-block;min-width:70px;border-bottom:4px dashed var(--b);text-align:center;color:var(--b)}.blank.filled{color:var(--gd);border-color:var(--g)}
.opts{display:grid;gap:8px}
.opt{background:#f4f8ff;border:3px solid #bcd3ff;border-bottom-width:6px;border-radius:16px;padding:10px 12px;font-size:1.05rem;font-weight:800;text-align:right;color:var(--tx);transition:.1s}
.opt:active{transform:translateY(3px)}
.opt.right{background:#d8ffe6;border-color:var(--g)}.opt.wrong{background:#ffe0dc;border-color:var(--r);animation:shake .4s}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.tfo{grid-template-columns:1fr 1fr}.opt.tf{text-align:center;font-size:1.4rem;padding:16px}
.why{border-radius:14px;padding:8px 12px;margin-top:10px;line-height:1.7;font-weight:700}
.why.good{background:#e0ffec;border:2px solid var(--g)}.why.bad{background:#fff0d6;border:2px solid #f2a33a}
.hint{margin-top:8px;font-weight:800;color:var(--rd);text-align:center}
.qfb .btn{display:block;margin:10px auto 2px;min-width:160px}
.slots{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.slot{background:#eef4ff;border:3px dashed #9db8ee;border-radius:12px;padding:8px 10px;min-height:44px;font-weight:800}.slot.full{border-style:solid;border-color:var(--g);background:#e0ffec}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip,.pool .chip{background:var(--y);border:0;border-bottom:4px solid var(--yd);border-radius:14px;padding:8px 12px;font-weight:800;font-size:1rem;color:var(--n)}.chip.used{opacity:.3}
.mat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:flex;flex-direction:column;gap:8px}
.mi{background:#f4f8ff;border:3px solid #bcd3ff;border-radius:14px;padding:8px;font-weight:800;font-size:.95rem;color:var(--tx);min-height:52px}
.mi.sel{background:#fff6c4;border-color:var(--y);transform:scale(1.03)}
.mi.ok{color:#fff}.mi.c0{background:#2f80ed}.mi.c1{background:#27ae60}.mi.c2{background:#9b51e0}.mi.c3{background:#f2994a}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* cards */
.cardview{text-align:center}.cv-ico{font-size:4rem}.cardview h3{margin:4px 0;color:var(--b);font-size:1.4rem}.cardview p{font-size:1.15rem;line-height:1.9;font-weight:700;margin:6px 4px 10px;text-align:right;min-height:140px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:#cbd5e1}.dots i.on{background:var(--b);transform:scale(1.3)}
.end{text-align:center}.end h2{margin:6px 0}.endav svg{height:170px;width:auto}.score{font-size:2.6rem;font-weight:900;direction:ltr}.how{text-align:right;line-height:1.9;font-weight:700}
/* cup */
.sb{display:flex;align-items:center;background:var(--nd);color:#fff;padding:6px 10px}
.sb .tm{flex:1;display:flex;flex-direction:column;align-items:center}.sb .tm b{font-size:2.2rem;line-height:1;color:var(--y)}.sb .tm small{font-size:.85rem;font-weight:800}
.sb .mid{text-align:center;flex:1.2}.sb .stage{font-weight:900;color:var(--y)}
.pitch{position:relative;direction:ltr;height:230px;background:repeating-linear-gradient(90deg,#2f9e44 0 12.5%,#37b24d 12.5% 25%);overflow:hidden;border-bottom:4px solid #fff}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid rgba(255,255,255,.5)}
.pitch.flash{animation:flash .5s 2}@keyframes flash{50%{filter:brightness(1.5)}}
.goal{position:absolute;right:0;bottom:14%;width:22%;height:68%;border:5px solid #fff;border-right:0;background:rgba(255,255,255,.12)}
.net{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.35) 8px 9px),repeating-linear-gradient(-45deg,transparent 0 8px,rgba(255,255,255,.35) 8px 9px)}
.keeper{position:absolute;right:20%;bottom:0;height:88%;transition:transform .5s}.keeper img{height:100%;display:block}
.keeper.dive{transform:translate(-20px,26px) rotate(-35deg)}
.yun{position:absolute;left:4%;bottom:4%;height:80%;transition:none}
.ball{position:absolute;width:30px;left:26%;bottom:8%;z-index:3}
.shout{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.6);font-weight:900;font-size:1.5rem;padding:4px 16px;border-radius:20px;opacity:0;transition:.25s;white-space:nowrap;z-index:5;direction:rtl}
.shout.on{opacity:1;transform:translateX(-50%) scale(1)}.shout.g{background:var(--y);color:var(--n)}.shout.b{background:#fff;color:var(--rd)}
.cupq{padding:10px 12px 24px}
.cup{min-height:100dvh;background:var(--bg)}
.tbar{height:10px;background:#cbd5e1}.tbar i{display:block;height:100%;background:var(--r);width:100%;transition:width .1s linear}
.cups{padding:12px;display:flex;flex-direction:column;gap:12px}
.cupcard{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--y);border-radius:20px;padding:10px}
.cupcard.locked{filter:grayscale(1);opacity:.7}.ctr svg{width:64px;height:auto}.cinfo{flex:1}.cinfo h3{margin:0 0 4px}
.mchips{display:flex;gap:4px;flex-wrap:wrap}.mc{background:#e3efff;border-radius:10px;padding:1px 8px;font-size:.8rem;font-weight:800}.mc.won{background:#c8f7d8}.mc.cur{background:var(--y)}
/* arcade etc */
.arc{padding:16px;display:flex;flex-direction:column;gap:14px}.arcb{display:flex;align-items:center;gap:12px;text-align:right;padding:14px}.arcb span{font-size:2.4rem}.arcb small{display:block;font-weight:600;opacity:.9}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.mcard{position:relative;height:96px;border:0;background:none;padding:0;perspective:600px}
.mcard span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;font-weight:900;padding:4px;font-size:.88rem;line-height:1.35;backface-visibility:hidden;transition:transform .35s}
.mcard .front{background:var(--b);color:#fff;font-size:2rem;border-bottom:5px solid var(--bd)}
.mcard .back{transform:rotateY(180deg);background:#fff;border:3px solid var(--y);color:var(--n)}.mcard .back.t{background:#fff6c4}
.mcard.up .front,.mcard.done .front{transform:rotateY(180deg)}.mcard.up .back,.mcard.done .back{transform:rotateY(0)}
.mcard.done .back{background:#d8ffe6;border-color:var(--g)}
.shelf{display:flex;justify-content:space-around;padding:14px;background:linear-gradient(#8a5a2b,#6b4220);border-bottom:8px solid #4a2f10}
.tr{text-align:center;filter:grayscale(1) brightness(.6);opacity:.7;color:#fff}.tr.on{filter:none;opacity:1}.tr svg{width:70px;height:auto}.tr small{display:block;font-weight:800}
.sec{margin:12px 16px 0}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.sticker{background:#fff;border:3px solid #cbd5e1;border-radius:16px;padding:8px;text-align:center;opacity:.6}.sticker.on{border-color:var(--y);background:#fffbe6;opacity:1}.sticker span{font-size:2.2rem;display:block}.sticker small{display:block;font-size:.78rem;font-weight:600}
.parent{padding:14px;line-height:1.8}.parent table{width:100%;border-collapse:collapse;font-size:.9rem}.parent td{border-bottom:1px solid #d6e2f5;padding:3px 4px}
.parent textarea{width:100%;height:70px;border:2px solid #bcd3ff;border-radius:10px;padding:6px;font-size:.75rem;direction:ltr;-webkit-user-select:text;user-select:text;margin:4px 0}
.tg{display:block;font-weight:700;margin:6px 0}.tg input{width:20px;height:20px;vertical-align:middle;margin-left:8px}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:var(--n);color:#fff;border:3px solid var(--y);border-radius:20px;padding:8px 18px;font-weight:900;z-index:100;transition:transform .35s;max-width:92vw;text-align:center}.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (max-height:460px) and (orientation:landscape){#cv{width:min(100%,calc((100dvh - 120px)*2))}.runbtns{padding:6px;flex:none}.btn.jump{padding:8px;font-size:1.1rem;height:auto;min-height:0}.logo .l2{font-size:2.8rem}}

/* modes */
.modehint{background:#fff;border:3px dashed var(--b);border-radius:18px;padding:14px;font-weight:900;text-align:center;line-height:1.8;width:100%;max-width:520px;align-self:center}
.penq{display:flex;gap:8px;align-items:flex-start;background:#fff;border-bottom:4px solid var(--y);padding:8px 12px;font-weight:900;font-size:1.1rem;line-height:1.7}
.penq .spk{flex:none}
.pen{position:relative;direction:ltr;height:min(400px,56dvh);background:repeating-linear-gradient(90deg,#2f9e44 0 12.5%,#37b24d 12.5% 25%);overflow:hidden}
.pgoal{position:absolute;left:3%;right:3%;top:8px;height:62%;border:6px solid #fff;border-bottom:0;background:rgba(255,255,255,.1)}
.zones{position:absolute;inset:0}
.zone{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;direction:rtl;padding:4px;font-weight:900;font-size:.86rem;line-height:1.3;background:rgba(255,255,255,.9);border:3px solid var(--n);border-radius:14px;color:var(--n);z-index:3;transition:transform .1s}
.zone:active{transform:scale(.97)}
.zone.z1{left:2%;top:4%;width:42%;height:43%}.zone.z2{right:2%;top:4%;width:42%;height:43%}.zone.z3{left:2%;bottom:4%;width:42%;height:43%}.zone.z4{right:2%;bottom:4%;width:42%;height:43%}
.zone.zl{left:2%;top:6%;width:42%;height:86%;font-size:1.4rem}.zone.zr{right:2%;top:6%;width:42%;height:86%;font-size:1.4rem}
.zone.right{background:#2ecc71;color:#fff}.zone.bad{background:#e74c3c;color:#fff}
.pkeeper{position:absolute;left:50%;bottom:calc(38% - 8px);height:30%;transform:translateX(-50%);transition:transform .45s;z-index:4;pointer-events:none}
.pkeeper img{height:100%;display:block}
.pkeeper.dl{transform:translateX(calc(-50% - 95px)) rotate(-40deg)}.pkeeper.dr{transform:translateX(calc(-50% + 95px)) rotate(40deg)}
.pyun{position:absolute;left:8%;bottom:0;height:36%;z-index:4}
.pball{position:absolute;width:32px;z-index:5;left:34%;bottom:5%}
.pfb{padding:0 12px 24px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}.modes .btn{font-size:.95rem;padding:8px 6px}.modes small{display:block;font-weight:700;opacity:.9}
.sec2{margin:12px 0 4px;font-weight:900;opacity:.8}

/* ===== subjects carousel ===== */
.subj{min-height:100dvh;display:flex;flex-direction:column;padding:10px 0 16px;background:radial-gradient(circle at 50% 20%,#fff 0,#cfe4ff 55%,#8fb7ff 100%)}
.subj .logo .l1{font-size:1.4rem}.subj .logo .l2{font-size:min(3.2rem,7dvh)}
.spick{text-align:center;font-weight:900;color:var(--n);margin:6px 0 2px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;flex:1;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 22px;text-align:center;position:relative}
.slide::before{content:'';position:absolute;inset:8px 14px;border-radius:28px;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--sc) 22%,#fff));border:4px solid var(--sc);box-shadow:0 10px 0 color-mix(in srgb,var(--sc) 55%,#000),0 16px 24px rgba(0,0,0,.18);z-index:0}
.slide>*{position:relative;z-index:1}
.sbig{font-size:3.4rem;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.slide h2{margin:0;font-size:1.8rem;color:var(--sc);font-weight:900;text-shadow:0 2px 0 #fff}
.ssub{font-weight:800;opacity:.75;direction:ltr}
.sart{height:min(30dvh,230px);display:flex;align-items:center;justify-content:center}.sart svg,.sart img{height:100%;width:auto;max-width:90%}
.sprog{display:flex;gap:14px;font-weight:900;color:var(--n)}
.sbar{width:70%;height:12px;border-radius:9px;background:#dfe9fb;overflow:hidden}.sbar i{display:block;height:100%;background:var(--sc);border-radius:9px;transition:width .4s}
.slide .btn.huge{margin-top:4px}
.cdots{display:flex;justify-content:center;gap:10px;margin:8px 0}
.cdots i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--n);opacity:.55;transition:.2s}.cdots i.on{background:var(--y);opacity:1;transform:scale(1.35)}
.home{--sc:var(--n)}

/* ===== parent gate ===== */
.gate h2{margin:4px 0}.pin{display:flex;justify-content:center;gap:12px;margin:10px 0}
.pin i{width:20px;height:20px;border-radius:50%;border:3px solid var(--n);background:#fff}.pin i.on{background:var(--n)}
.pin.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto;direction:ltr}.pad .btn{font-size:1.5rem;padding:10px 0;min-height:52px}

/* ===== English (science) questions ===== */
.qbox.en .qtext,.qbox.en .opts,.qbox.en .slots,.qbox.en .pool,.qbox.en .mat{direction:ltr}
.qbox.en .qtext{text-align:left;font-family:'Cairo',system-ui,sans-serif}
.qbox.en .opt{text-align:left}.qbox.en .opt.tf{text-align:center}
.qbox.en .why{direction:rtl;text-align:right}
body.en #pq,body.en .zone{direction:ltr}body.en #pq{text-align:center}

/* ===== 3D ===== */
.hero3{display:flex;justify-content:center}.hero3 canvas{width:min(62vw,300px);height:min(62vw,300px);max-height:34dvh;max-width:34dvh;display:block;touch-action:none}
.sart .hero3{height:100%}.sart .hero3 canvas{height:100%;width:auto;max-width:90%;aspect-ratio:1}
.p3d{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;display:block}
.pen3,.pitch3{background:none!important}.pen3 .pgoal{border-color:transparent;background:none}.pen3 .net,.pen3 .pyun,.pen3 .pball,.pen3 .pkeeper,.pitch3 .goal,.pitch3 .keeper,.pitch3 .yun,.pitch3 .ball,.pitch3::before{display:none!important}
.pen3 .zone{background:rgba(255,255,255,.55)}.pen3 .zone.right{background:rgba(46,204,113,.92)}.pen3 .zone.bad{background:rgba(231,76,60,.92)}
.pitch3{height:250px}

/* ===== Coach & Exercises ===== */
.btn.coachb{background:linear-gradient(#8a6cff,#6a4be0);border-bottom-color:#4a31b3;color:#fff;font-weight:900;letter-spacing:.5px}
.grid2.two{margin-bottom:0}
.coachpg{padding:10px 14px;display:flex;flex-direction:column;gap:10px;height:calc(100dvh - 70px)}
.cin textarea{text-align:start;width:100%;border:3px solid var(--n);border-radius:16px;padding:10px;font:700 1rem Cairo,sans-serif;resize:none;direction:auto;background:#fff}
.crow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.crow .btn{flex:1}
.cans{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.cemp{text-align:center;font-weight:800;color:var(--n);padding:10px}.cemp .lbig{height:110px}
.cb2{padding:10px 14px;border-radius:16px;font-weight:700;max-width:92%}.cb2.me{background:#e6edff;align-self:flex-start}.cb2.wait,.cb2.ai{background:#fff7d6}.cb2.err{background:#ffe1e1}
.ka{background:#fff;border:3px solid #6a4be0;border-radius:18px;padding:12px;box-shadow:0 4px 0 #4a31b3}
.kt{font-weight:900;color:#6a4be0;margin-bottom:6px}.kans{font-weight:800;line-height:1.7}.kq{opacity:.7;margin-bottom:6px;font-weight:700}
.ltr{direction:ltr;text-align:left}.kw{margin-top:8px;background:#fff7d6;border-radius:12px;padding:8px;font-weight:700}.ks{margin-top:6px;font-size:.8rem;opacity:.7}
.knf{background:#fff0e0;border-radius:14px;padding:10px;font-weight:800}.ksim{font-size:.9rem;padding:4px 8px}

.exs{display:flex;flex-direction:column;gap:6px}.exst{font-weight:900;background:#6a4be0;color:#fff;border-radius:12px;padding:6px 12px}.exst small{opacity:.8}

.exnote{margin:8px 14px 0;padding:8px 12px;background:#e8f7ec;border-radius:12px;font-weight:800;color:#1f7a3a;text-align:center}
</style></head><body><div id="app"></div>
<script>
/* ===== Captain Yunus — cartoon art (all SVG, drawn in code) ===== */
const C = {
  skin:'#e8b68d', skinD:'#cf986f', out:'#2a170d', hair:'#2b170d', hairL:'#4d2d19',
  jer:'#ffd21f', jerD:'#e5b400', navy:'#13265c', white:'#ffffff', red:'#e63946'
};
function _rot(a,x,y){ const r=a*Math.PI/180, c=Math.cos(r), s=Math.sin(r); return [x*c-y*s, x*s+y*c]; }
const svgURI = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);

/* poses: a = arm angle (outward, deg), l = leg angle (outward, deg) for [left,right] on screen */
const POSES = {
  stand:  {aL:10, aR:10, lL:4,  lR:4,  mood:'happy', tilt:0},
  idle:   {aL:14, aR:14, lL:5,  lR:5,  mood:'happy', tilt:-2},
  run1:   {aL:62, aR:8,  lL:34, lR:-6, mood:'happy', tilt:-3},
  run2:   {aL:8,  aR:62, lL:-6, lR:34, mood:'happy', tilt:3},
  jump:   {aL:135,aR:135,lL:28, lR:-14,mood:'cheer', tilt:0},
  cheer:  {aL:118,aR:118,lL:10, lR:10, mood:'cheer', tilt:0, thumbs:true},
  think:  {aL:14, aR:150,lL:4,  lR:4,  mood:'think', tilt:4, chin:true},
  kick:   {aL:50, aR:70, lL:-6, lR:52, mood:'cheer', tilt:-4},
  hurt:   {aL:40, aR:30, lL:14, lR:-14,mood:'oops',  tilt:8},
  sad:    {aL:6,  aR:6,  lL:2,  lR:2,  mood:'sad',   tilt:6},
  wow:    {aL:70, aR:70, lL:8,  lR:8,  mood:'wow',   tilt:0},
  wave:   {aL:10, aR:140,lL:4,  lR:4,  mood:'happy', tilt:0}
};

function _eyes(m){
  const brow = (a)=>`<path d="${a}" stroke="${C.hair}" stroke-width="6.5" fill="none" stroke-linecap="round"/>`;
  const eye = (cx,dx=0,dy=0,ry=15)=>`<ellipse cx="${cx}" cy="0" rx="12.5" ry="${ry}" fill="#fff" stroke="${C.out}" stroke-width="2.4"/>
    <circle cx="${cx+dx}" cy="${dy+1}" r="8.6" fill="#5a3418"/><circle cx="${cx+dx}" cy="${dy+1}" r="5.6" fill="#1a0d07"/>
    <circle cx="${cx+dx+3}" cy="${dy-3}" r="2.8" fill="#fff"/><circle cx="${cx+dx-3}" cy="${dy+4}" r="1.3" fill="#fff"/>`;
  if(m==='cheer') return `<g transform="translate(0,-4)">${eye(-27,0,1,14)}${eye(27,0,1,14)}</g>`+
      brow('M-42 -24 Q-27 -34 -12 -24')+brow('M12 -24 Q27 -34 42 -24');
  if(m==='sad') return `<g transform="translate(0,-2)">${eye(-27,0,5,14)}${eye(27,0,5,14)}</g>`+
      brow('M-42 -20 L-14 -30')+brow('M42 -20 L14 -30')+`<path d="M-33 14 q-6 10 0 16 q6 -6 0 -16z" fill="#7fd0ff" stroke="${C.out}" stroke-width="1.6"/>`;
  if(m==='think') return `<g transform="translate(0,-4)">${eye(-27,5,-4,14)}${eye(27,5,-4,14)}</g>`+
      brow('M-42 -22 Q-27 -28 -12 -22')+brow('M12 -34 Q27 -42 42 -30');
  if(m==='wow') return `<g transform="translate(0,-4)">${eye(-27,0,0,17)}${eye(27,0,0,17)}</g>`+
      brow('M-42 -30 Q-27 -42 -12 -30')+brow('M12 -30 Q27 -42 42 -30');
  if(m==='oops') return `<path d="M-38 -6 l22 12 M-16 -6 l-22 12 M16 -6 l22 12 M38 -6 l-22 12" stroke="${C.out}" stroke-width="5" stroke-linecap="round"/>`+
      brow('M-42 -22 L-14 -30')+brow('M42 -22 L14 -30');
  return `<g transform="translate(0,-3)">${eye(-27,0,1,15)}${eye(27,0,1,15)}</g>`+
      brow('M-42 -26 Q-27 -34 -12 -27')+brow('M12 -27 Q27 -34 42 -26');
}
function _mouth(m){
  if(m==='cheer') return `<path d="M-32 24 Q0 70 32 24 Q0 32 -32 24Z" fill="#7a1b22" stroke="${C.out}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-26 26 Q0 36 26 26 L24 34 Q0 44 -24 34Z" fill="#fff"/><path d="M-1.5 27 v8" stroke="${C.skinD}" stroke-width="1.6"/>
    <ellipse cx="0" cy="50" rx="14" ry="7" fill="#ff7c8f"/>`;
  if(m==='sad') return `<path d="M-18 46 Q0 30 18 46" stroke="#7a1b22" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(m==='think') return `<path d="M-14 40 Q4 48 22 34" stroke="#7a1b22" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(m==='wow') return `<ellipse cx="0" cy="42" rx="12" ry="16" fill="#7a1b22" stroke="${C.out}" stroke-width="3"/><ellipse cx="0" cy="50" rx="7" ry="5" fill="#ff7c8f"/>`;
  if(m==='oops') return `<path d="M-24 40 q8 -10 16 0 q8 10 16 0 q8 -10 16 0" stroke="#7a1b22" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  return `<path d="M-30 26 Q0 62 30 26 Q0 34 -30 26Z" fill="#7a1b22" stroke="${C.out}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-24 28 Q0 38 24 28 L22 35 Q0 44 -22 35Z" fill="#fff"/><path d="M-1.5 29 v7" stroke="${C.skinD}" stroke-width="1.6"/>`;
}
function _hair(){
  const cl = [[-48,-34,23],[-30,-52,24],[-6,-60,26],[20,-58,25],[42,-46,23],[54,-26,19],[-34,-30,18],[-12,-34,18],[14,-34,18],[36,-24,16]];
  const fr = [[-30,-26,13],[-8,-30,13],[14,-30,13],[34,-24,12]];
  const circ = (arr,fill,stroke) => arr.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${fill}" ${stroke?`stroke="${stroke}" stroke-width="5.5"`:''}/>`).join('');
  return `<g>${circ(cl,C.hair,C.out)}${circ(fr,C.hair,C.out)}${circ(cl,C.hair)}${circ(fr,C.hair)}
    <path d="M-40 -48 q10 -10 22 -4 M-6 -66 q14 -6 24 4 M26 -54 q12 -2 18 10 M-52 -24 q4 -12 14 -14" stroke="${C.hairL}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-56 -4 q-4 14 0 26 q6 -4 6 -14z M56 -4 q4 14 0 26 q-6 -4 -6 -14z" fill="${C.hair}" stroke="${C.out}" stroke-width="2"/></g>`;
}
function _head(p){
  return `<g transform="translate(110,98) rotate(${p.tilt||0})">
    <ellipse cx="-56" cy="8" rx="11" ry="15" fill="${C.skin}" stroke="${C.out}" stroke-width="3.5"/><ellipse cx="-56" cy="9" rx="5" ry="8" fill="${C.skinD}"/>
    <ellipse cx="56" cy="8" rx="11" ry="15" fill="${C.skin}" stroke="${C.out}" stroke-width="3.5"/><ellipse cx="56" cy="9" rx="5" ry="8" fill="${C.skinD}"/>
    <ellipse cx="0" cy="4" rx="54" ry="57" fill="${C.skin}" stroke="${C.out}" stroke-width="4"/>
    <ellipse cx="-36" cy="28" rx="13" ry="9" fill="#ff8a8a" opacity=".38"/><ellipse cx="36" cy="28" rx="13" ry="9" fill="#ff8a8a" opacity=".38"/>
    ${_eyes(p.mood)}
    <path d="M-4 14 Q0 20 6 14" stroke="${C.skinD}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    ${_mouth(p.mood)}
    ${_hair()}
  </g>`;
}
function _arm(side,ang,thumbs,band){
  const px = side<0 ? 72 : 148, py = 163, a = side<0 ? ang : -ang;
  let th='';
  if(thumbs){ const v=_rot(-a,0,-1); const x2=v[0]*15, y2=50+v[1]*15;
    th=`<path d="M0 50 L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${C.out}" stroke-width="14" stroke-linecap="round"/><path d="M0 50 L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${C.skin}" stroke-width="9" stroke-linecap="round"/>`; }
  return `<g transform="translate(${px},${py}) rotate(${a})">
    <rect x="-8" y="20" width="16" height="30" rx="8" fill="${C.skin}" stroke="${C.out}" stroke-width="3.2"/>
    <circle cx="0" cy="52" r="10.5" fill="${C.skin}" stroke="${C.out}" stroke-width="3.2"/>${th}
    <rect x="-12" y="-9" width="24" height="32" rx="11" fill="${C.jer}" stroke="${C.out}" stroke-width="3.2"/>
    <rect x="-12" y="15" width="24" height="8" rx="3" fill="${C.navy}" stroke="${C.out}" stroke-width="2.4"/>
    ${band?`<rect x="-12" y="-3" width="24" height="11" fill="${C.red}" stroke="${C.out}" stroke-width="2"/><text x="0" y="6.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="10" fill="#fff">C</text>`:''}
  </g>`;
}
function _leg(side,ang){
  const px = side<0 ? 90 : 130, py = 228, a = side<0 ? ang : -ang;
  return `<g transform="translate(${px},${py}) rotate(${a})">
    <rect x="-8.5" y="0" width="17" height="46" rx="7" fill="${C.skin}" stroke="${C.out}" stroke-width="3.2"/>
    <rect x="-10" y="18" width="20" height="26" rx="5" fill="#fff" stroke="${C.out}" stroke-width="3"/>
    <rect x="-10" y="18" width="20" height="7" rx="3" fill="${C.jer}" stroke="${C.out}" stroke-width="2"/>
    <path d="M-12 44 Q-14 58 0 58 L14 58 Q22 58 20 49 Q18 42 8 42 Z" fill="#fff" stroke="${C.out}" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M-12 55 L19 55" stroke="${C.navy}" stroke-width="3"/>
  </g>`;
}
function yunusSVG(poseName,opt){
  const p = Object.assign({}, POSES[poseName]||POSES.stand, opt||{});
  const ball = p.ball ? `<g transform="translate(160,262)">${ballInner(15)}</g>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 292" width="220" height="292">
    <ellipse cx="110" cy="284" rx="62" ry="6" fill="#000" opacity=".16"/>
    ${_leg(-1,p.lL)}${_leg(1,p.lR)}
    <path d="M70 205 L150 205 L156 240 L117 240 L110 228 L103 240 L64 240 Z" fill="${C.navy}" stroke="${C.out}" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M70 160 Q70 150 84 149 L136 149 Q150 150 150 160 L154 208 Q110 220 66 208 Z" fill="${C.jer}" stroke="${C.out}" stroke-width="3.8" stroke-linejoin="round"/>
    <path d="M76 190 Q110 200 144 190" stroke="${C.jerD}" stroke-width="3" fill="none" opacity=".7"/>
    ${_arm(-1,p.aL,p.thumbs,true)}${_arm(1,p.aR,p.thumbs,false)}
    <rect x="100" y="140" width="20" height="16" fill="${C.skin}" stroke="${C.out}" stroke-width="3"/>
    <path d="M92 148 L110 176 L100 180 L84 158 Z M128 148 L110 176 L120 180 L136 158 Z" fill="${C.navy}" stroke="${C.out}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M110 176 V205" stroke="${C.out}" stroke-width="2.4"/><circle cx="110" cy="186" r="3.4" fill="${C.navy}" stroke="${C.out}" stroke-width="1.6"/><circle cx="110" cy="198" r="3.4" fill="${C.navy}" stroke="${C.out}" stroke-width="1.6"/>
    <path d="M122 166 l4 -8 l4 8 l-8 -5 l8 0z" fill="${C.navy}" opacity=".0"/>
    ${_head(p)}
    ${ball}
  </svg>`;
}
/* ----- ball ----- */
function ballInner(r){
  const k=r/20;
  return `<g transform="scale(${k})"><circle r="20" fill="#fff" stroke="${C.out}" stroke-width="2.6"/>
   <path d="M0 -8 L7.6 -2.5 L4.7 6.5 L-4.7 6.5 L-7.6 -2.5 Z" fill="#1d1d1d"/>
   <path d="M0 -8 L0 -19 M7.6 -2.5 L18 -6 M4.7 6.5 L11 15.5 M-4.7 6.5 L-11 15.5 M-7.6 -2.5 L-18 -6" stroke="#1d1d1d" stroke-width="2.4"/>
   <path d="M-10 -17 L-4 -19.5 L0 -15 L-6 -12Z M10 -17 L4 -19.5 L0 -15 L6 -12Z" fill="#1d1d1d"/></g>`;
}
const ballSVG = r => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-r-3} ${-r-3} ${2*r+6} ${2*r+6}" width="${2*r+6}" height="${2*r+6}">${ballInner(r)}</svg>`;

/* ----- trophy ----- */
function trophySVG(gold){
  const g1 = gold||'#ffcf2e', g2='#f29e0c';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190">
   <defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient></defs>
   <path d="M34 28 Q6 30 12 62 Q18 90 52 94" fill="none" stroke="${C.out}" stroke-width="11" stroke-linecap="round"/><path d="M34 28 Q6 30 12 62 Q18 90 52 94" fill="none" stroke="url(#tg)" stroke-width="6" stroke-linecap="round"/>
   <path d="M126 28 Q154 30 148 62 Q142 90 108 94" fill="none" stroke="${C.out}" stroke-width="11" stroke-linecap="round"/><path d="M126 28 Q154 30 148 62 Q142 90 108 94" fill="none" stroke="url(#tg)" stroke-width="6" stroke-linecap="round"/>
   <path d="M30 14 H130 V56 Q130 108 80 116 Q30 108 30 56 Z" fill="url(#tg)" stroke="${C.out}" stroke-width="5" stroke-linejoin="round"/>
   <path d="M44 24 V60 Q46 94 66 104" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
   <path d="M80 36 l7 15 17 2 -12 12 3 17 -15 -8 -15 8 3 -17 -12 -12 17 -2z" fill="#fff6c9" stroke="${C.out}" stroke-width="3" stroke-linejoin="round"/>
   <rect x="68" y="116" width="24" height="26" fill="url(#tg)" stroke="${C.out}" stroke-width="4"/>
   <path d="M44 142 H116 L124 160 H36 Z" fill="${C.navy}" stroke="${C.out}" stroke-width="4" stroke-linejoin="round"/>
   <rect x="30" y="160" width="100" height="20" rx="5" fill="${g2}" stroke="${C.out}" stroke-width="4"/>
   <rect x="52" y="165" width="56" height="10" rx="3" fill="#fff2a8" opacity=".7"/>
  </svg>`;
}

/* ----- other footballers (opponent goalkeeper / players) ----- */
function keeperSVG(shirt, shorts, skin, hairC, pose){
  skin = skin||'#d9a074'; hairC = hairC||'#2b1a10'; shirt = shirt||'#e63946'; shorts = shorts||'#222';
  const armsUp = pose==='save';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
   <g stroke="${C.out}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="52" y="140" width="18" height="60" rx="8" fill="${skin}"/><rect x="90" y="140" width="18" height="60" rx="8" fill="${skin}"/>
    <rect x="50" y="168" width="22" height="30" rx="5" fill="#fff"/><rect x="88" y="168" width="22" height="30" rx="5" fill="#fff"/>
    <path d="M44 196 q-2 14 12 14 h14 q8 0 6 -9 q-3 -6 -12 -5z M116 196 q2 14 -12 14 h-14 q-8 0 -6 -9 q3 -6 12 -5z" fill="#222"/>
    <path d="M46 120 H114 L118 160 H84 L80 148 L76 160 H42 Z" fill="${shorts}"/>
    <path d="M44 82 Q44 70 58 68 H102 Q116 70 116 82 L120 128 Q80 140 40 128 Z" fill="${shirt}"/>
    ${armsUp?`<g transform="translate(46,80) rotate(150)"><rect x="-10" y="-4" width="20" height="40" rx="10" fill="${shirt}"/><circle cx="0" cy="42" r="13" fill="#34c759"/></g>
              <g transform="translate(114,80) rotate(-150)"><rect x="-10" y="-4" width="20" height="40" rx="10" fill="${shirt}"/><circle cx="0" cy="42" r="13" fill="#34c759"/></g>`
    :`<g transform="translate(46,80) rotate(36)"><rect x="-10" y="-4" width="20" height="40" rx="10" fill="${shirt}"/><circle cx="0" cy="42" r="13" fill="#34c759"/></g>
      <g transform="translate(114,80) rotate(-36)"><rect x="-10" y="-4" width="20" height="40" rx="10" fill="${shirt}"/><circle cx="0" cy="42" r="13" fill="#34c759"/></g>`}
    <rect x="72" y="58" width="16" height="14" fill="${skin}"/>
    <circle cx="80" cy="40" r="30" fill="${skin}"/>
    <path d="M50 38 Q52 10 80 10 Q108 10 110 38 Q96 24 80 24 Q64 24 50 38Z" fill="${hairC}"/>
    <circle cx="68" cy="42" r="4.6" fill="#1a0d07" stroke="none"/><circle cx="92" cy="42" r="4.6" fill="#1a0d07" stroke="none"/>
    <path d="M66 54 Q80 66 94 54" fill="none"/>
    <path d="M60 33 L74 36 M100 33 L86 36" fill="none"/>
   </g></svg>`;
}
const _CACHE={};
function art(kind,a,b,c,d,e){
  const key=[kind,a,b,c,d,e].join('|');
  if(_CACHE[key]) return _CACHE[key];
  let s;
  if(kind==='yunus') s=yunusSVG(a,b);

/* helpers */
function indexSubject(LS, US) {
  const LBY = {}, UBY = {}, QBY = {};
  LS.forEach((l, i) => { l.idx = i; LBY[l.id] = l; l.qs.forEach((q, j) => { q.id = l.id + '-' + j; q.lesson = l.id; QBY[q.id] = q; }); });
  US.forEach(u => { UBY[u.id] = u; u.lessons = LS.filter(l => l.unit === u.id); });
  return { LBY, UBY, QBY };
}

const rnd = n => Math.floor(Math.random() * n);
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const Q = s => EN ? String(s) : D(s); /* question text: English keeps Western digits */

/* ---------- question renderer ---------- */
const TYPE_LABEL = { mc: 'اختار الإجابة الصح', tf: 'صح ولا غلط؟', ord: 'رتّب بالترتيب الصح', mat: 'وصّل كل واحد بنظيره' };
/* o: {retry, onWrong()->dead?, onAnswer(ok), onDone(ok), btn} */
function renderQ(host, q, o) {
  o = o || {}; host.innerHTML = '';
  const box = el('div', 'qbox'); host.appendChild(box);
  const top = el('div', 'qtop');
  top.appendChild(el('span', 'qtype', TYPE_LABEL[q.t]));
  const sp = el('button', 'spk', '🔊'); sp.title = 'اقرأ لي'; sp.onclick = () => { sfx('click'); say(q.q); }; top.appendChild(sp);
  box.appendChild(top);
  if (EN) box.classList.add('en');
  const qt = el('div', 'qtext'); qt.innerHTML = Q(esc(q.q)).replace(/\.{6}/g, '<span class="blank">' + (EN ? '___' : '؟؟؟') + '</span>'); box.appendChild(qt);
  const body = el('div', 'qbody'); box.appendChild(body);
  const fb = el('div', 'qfb'); box.appendChild(fb);
  let wrong = 0, fin = false, dead = false;
  const miss = () => { wrong++; addMistake(q.id); sfx('bad'); if (o.onWrong && o.onWrong() === true) { dead = true; fin = true; } };
  const finish = () => {
    if (fin && dead) return; fin = true;
    const ok = wrong === 0;
    const blank = $('.blank', qt); if (blank && q.ok) { blank.textContent = Q(q.ok); blank.classList.add('filled'); }
    fb.innerHTML = `<div class="why ${ok ? 'good' : 'bad'}"><b>${ok ? PRAISE[rnd(PRAISE.length)] : OOPS[rnd(OOPS.length)]}</b><br>💡 ${D(esc(q.why || ''))}</div>`;
    if (ok) sfx('ok');
    o.onAnswer && o.onAnswer(ok);
    const b = el('button', 'btn go', o.btn || 'كمّل ◀'); b.onclick = () => { sfx('click'); b.disabled = true; o.onDone && o.onDone(ok); };
    fb.appendChild(b);
  };
  if (q.t === 'mc') {
    const opts = shuf([q.ok, ...q.bad]); const g = el('div', 'opts'); body.appendChild(g);
    opts.forEach(t => {
      const b = el('button', 'opt', Q(esc(t))); g.appendChild(b);
      b.onclick = () => {
        if (fin || b.disabled) return;
        if (t === q.ok) { b.classList.add('right'); [...g.children].forEach(x => x.disabled = true); finish(); }
        else {
          b.classList.add('wrong'); b.disabled = true; miss();
          if (dead) { [...g.children].forEach(x => x.disabled = true); return; }
          if (o.retry === false) { [...g.children].forEach(x => { x.disabled = true; if (x.textContent === Q(q.ok)) x.classList.add('right'); }); finish(); }
          else fb.innerHTML = '<div class="hint">جرّب تاني 🤔 (وخد بالك من الأقلام الحمرا)</div>';
        }
      };
    });
  } else if (q.t === 'tf') {
    const g = el('div', 'opts tfo'); body.appendChild(g);
    [[true, EN ? '✅ True' : '✅ صح'], [false, EN ? '❌ False' : '❌ غلط']].forEach(([v, t]) => {
      const b = el('button', 'opt tf ' + (v ? 'tt' : 'ff'), t); g.appendChild(b);
      b.onclick = () => {
        if (fin || b.disabled) return;
        if (v === q.v) { b.classList.add('right'); [...g.children].forEach(x => x.disabled = true); finish(); }
        else {
          b.classList.add('wrong'); b.disabled = true; miss();
          if (dead) { [...g.children].forEach(x => x.disabled = true); return; }
          if (o.retry === false) { [...g.children].forEach(x => { x.disabled = true; if (x !== b) x.classList.add('right'); }); finish(); }
          else fb.innerHTML = '<div class="hint">جرّب الاختيار التاني 🤔</div>';
        }
      };
    });
  } else if (q.t === 'ord') {
    const slots = el('div', 'slots'); const pool = el('div', 'pool'); body.appendChild(slots); body.appendChild(pool);
    q.items.forEach((_, i) => slots.appendChild(el('div', 'slot', D(i + 1))));
    let next = 0;
    shuf(q.items.map((t, i) => ({ t, i }))).forEach(it => {
      const c = el('button', 'chip', Q(esc(it.t))); pool.appendChild(c);
      c.onclick = () => {
        if (fin || c.disabled) return;
        if (it.i === next) {
          const s = slots.children[next]; s.textContent = ''; s.innerHTML = Q(esc(it.t)); s.classList.add('full'); c.disabled = true; c.classList.add('used'); next++; sfx('coin');
          if (next === q.items.length) finish();
        } else { c.classList.add('shake'); setTimeout(() => c.classList.remove('shake'), 400); miss(); if (dead) pool.querySelectorAll('button').forEach(x => x.disabled = true); }
      };
    });
  } else if (q.t === 'mat') {
    const cols = el('div', 'mat'); body.appendChild(cols);
    const L = el('div', 'mcol'), R = el('div', 'mcol'); cols.appendChild(L); cols.appendChild(R);
    const rs = shuf(q.pairs.map((p, i) => ({ t: p[1], i })));
    let sel = null, done = 0;
    const mk = (parent, side, t, i) => {
      const b = el('button', 'mi', Q(esc(t))); parent.appendChild(b);
      b.onclick = () => {
        if (fin || b.disabled) return;
        if (!sel || sel.side === side) { if (sel) sel.b.classList.remove('sel'); sel = { side, i, b }; b.classList.add('sel'); sfx('click'); return; }
        if (sel.i === i) {
          const col = done % 4; [sel.b, b].forEach(x => { x.classList.remove('sel'); x.classList.add('ok', 'c' + col); x.disabled = true; });
          sel = null; done++; sfx('coin'); if (done === q.pairs.length) finish();
        } else {
          const a = sel.b; a.classList.remove('sel'); [a, b].forEach(x => x.classList.add('shake')); setTimeout(() => [a, b].forEach(x => x.classList.remove('shake')), 400); sel = null; miss();
          if (dead) cols.querySelectorAll('button').forEach(x => x.disabled = true);
        }
      };
    };
    q.pairs.forEach((p, i) => mk(L, 'L', p[0], i));
    rs.forEach(r => mk(R, 'R', r.t, r.i));
  }
  return { kill() { fin = true; } };
}

/* ---------- memory match ---------- */
function startMemory(host, onExit) {
  const all = shuf(LESSONS.flatMap(l => l.vocab.map(v => ({ t: v[0], d: v[1] })))).slice(0, 6);
  const cards = shuf(all.flatMap((p, i) => [{ i, txt: p.t, k: 't' }, { i, txt: p.d, k: 'd' }]));
  let open = [], found = 0, moves = 0, lock = false;
  host.innerHTML = `<div class="runtop"><button class="btn-ico" id="mx">✖</button><div class="cuptitle">🧠 لعبة الذاكرة</div><div class="coins">حركات <b id="mv">٠</b></div></div><p class="sm center">لاقي المصطلح وتعريفه 👇</p><div class="mem" id="mg"></div>`;
  $('#mx', host).onclick = () => onExit();
  const g = $('#mg', host);
  cards.forEach(c => {
    const b = el('button', 'mcard'); b.innerHTML = `<span class="front">❓</span><span class="back ${c.k}">${D(esc(c.txt))}</span>`; g.appendChild(b);
    b.onclick = () => {
      if (lock || b.classList.contains('up') || b.classList.contains('done')) return;
      b.classList.add('up'); sfx('click'); open.push({ c, b });
      if (open.length === 2) {
        moves++; $('#mv', host).textContent = D(moves); lock = true;
        const [a, d] = open;
        if (a.c.i === d.c.i) { setTimeout(() => { a.b.classList.add('done'); d.b.classList.add('done'); sfx('coin'); found++; open = []; lock = false; if (found === all.length) done(); }, 400); }
        else setTimeout(() => { a.b.classList.remove('up'); d.b.classList.remove('up'); open = []; lock = false; }, 1100);
      }
    };
  });
  function done() {
    const bonus = moves <= 10 ? 20 : 10; S.coins += bonus; S.flags.mem = 1; save(); checkStickers(); sfx('win'); confetti(2000);
    const m = modal(`<div class="end"><div class="endav">${art('yunus', 'cheer')}</div><h2>ذاكرة حديد! 🧠</h2><p>خلّصت في <b>${D(moves)}</b> حركة — 🪙 +${D(bonus)}</p><div class="row"><button class="btn go" id="e1">🔁 تاني</button><button class="btn" id="e2">رجوع</button></div></div>`);
    $('#e1', m).onclick = () => { m.close(); startMemory(host, onExit); }; $('#e2', m).onclick = () => { m.close(); onExit(); };
  }
}

/* ---------- speed challenge ---------- */
function startSpeed(host, onExit) {
  const qs = shuf(LESSONS.flatMap(l => l.qs).filter(CUPQ)).slice(0, 10); let i = 0, score = 0, timer = null, alive = true;
  host.innerHTML = `<div class="runtop"><button class="btn-ico" id="sx">✖</button><div class="cuptitle">⚡ تحدي السرعة</div><div class="coins">✅ <b id="sc">٠</b></div></div><div class="tbar"><i id="tb"></i></div><div id="qh" class="cupq"></div>`;
  const stop = () => { alive = false; clearInterval(timer); };
  $('#sx', host).onclick = () => { stop(); onExit(); };
  function next() {
    if (!alive) return; if (i >= qs.length) return end();
    const q = qs[i++]; let t = 14; const tb = $('#tb', host); tb.style.width = '100%';
    clearInterval(timer);
    let answered = false;
    renderQ($('#qh', host), q, { retry: false, btn: 'التالي ◀', onAnswer(ok) { answered = true; clearInterval(timer); if (ok) { score++; $('#sc', host).textContent = D(score); } }, onDone() { next(); } });

  }
  function end() {
    stop(); const bonus = score * 3; S.coins += bonus; if (score >= 9) S.flags.spd = 1; save(); checkStickers(); sfx('win'); if (score >= 7) confetti(2000);
    const m = modal(`<div class="end"><div class="endav">${art('yunus', score >= 7 ? 'cheer' : 'wow')}</div><h2>${D(score)} من ${D(10)}</h2><p>${score >= 9 ? 'سريع زي البرق! ⚡' : score >= 6 ? 'كويس جدًا! كمّل تدريب 💪' : 'حاول تاني وهتتحسن! 📚'}</p><p>🪙 +${D(bonus)}</p><div class="row"><button class="btn go" id="e1">🔁 تاني</button><button class="btn" id="e2">رجوع</button></div></div>`);

  }
  next();
}

function initBack() {
  try { history.replaceState({ a: 0 }, ''); history.pushState({ a: 1 }, ''); } catch (e) { return; }
  let last = 0; const guard = () => { try { history.pushState({ a: 1 }, ''); } catch (_) { } };
  addEventListener('popstate', () => {
    const ms = [...document.querySelectorAll('.qmodal')], top = ms[ms.length - 1];
    if (top) { guard(); if (top.classList.contains('run') || top.querySelector('.end')) return; const no = $('#cn', top); if (no) no.click(); else if (top.close) top.close(); return; }
    const sc = CUR[0], x = $('.runtop .btn-ico');
    if (['run', 'match', 'mem', 'speed', 'mist'].includes(sc) && x) { guard(); x.click(); return; }
    if (sc === 'subjects') { if (Date.now() - last < 2200) { history.back(); return; } last = Date.now(); toast('اضغط رجوع مرة تانية للخروج من اللعبة', 1800); guard(); return; }
    guard(); const P = PARENT[sc]; go(typeof P === 'function' ? P(CUR[1]) : (P || 'home'));
  });
}
